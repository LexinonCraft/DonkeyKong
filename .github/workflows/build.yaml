name: build
run-name: Build and Test
on: [push]
permissions:
  contents: read
  pages: write
  id-token: write
env:
  APT_DEPENDENCIES: cmake libsfml-dev libx11-dev xorg-dev libudev-dev libvorbis-dev libflac-dev
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $APT_DEPENDENCIES
      - name: Build
        run: |
          cmake -B build
          cmake --build build
          ./build/bin/Test

  check-format:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: Check Format
        run: |
          ./clang-format.sh

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen $APT_DEPENDENCIES
      - name: Generate Documentation
        run: |
          doxygen --version
          cmake -B build
          cmake --build build --target docs
      - name: Upload Documentation Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: html
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: html

  deploy-docs:
    if: github.ref == 'refs/heads/main'
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
