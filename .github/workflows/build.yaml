name: build
run-name: Build and Test
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libsfml-dev libx11-dev xorg-dev
      - name: Build
        run: |
          cmake -B build
          cmake --build build
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libsfml-dev libx11-dev xorg-dev
      - name: Test
        run: |
          make getSFML
          make tests
          ./tests
