name: build
run-name: Build and Test
on: [push]
env:
  APT_DEPENDENCIES: cmake libsfml-dev libx11-dev xorg-dev libudev-dev libvorbis-dev libflac-dev
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: $APT_DEPENDENCIES
          version: 1.0
      - name: Build
        run: |
          cmake -B build
          cmake --build build
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: $APT_DEPENDENCIES
          version: 1.0
      - name: Test
        run: |
          make getGTest
          make getSFML
          make tests
          ./tests
